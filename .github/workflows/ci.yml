name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: Build, test and UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build ActiveRest.sln -c Release

      - name: Unit tests
        run: dotnet test tests/ActiveRest.Tests -c Release --no-build

      - name: UI smoke test (headless rendering and interaction checks)
        run: dotnet run -c Release --no-build --project tools/Screenshots -- artifacts --selftest

      - name: Upload rendered windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-windows
          path: artifacts/*.png
          if-no-files-found: ignore

  windows:
    name: Publish Windows build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: >
          dotnet publish ActiveRest.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ActiveRest-win-x64
          path: publish/ActiveRest.exe
