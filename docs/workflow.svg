<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">ActiveRest workflow diagram</title>
  <desc id="desc">A conceptual diagram of the revised local timer: choose Start tracking, observe activity, review today's totals, pause or resume, and export or delete local history. This is not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091d37"/><stop offset="1" stop-color="#173f6a"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#f8fbff" stop-opacity=".98"/><stop offset="1" stop-color="#dbe9f8" stop-opacity=".92"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#031025" flood-opacity=".26"/></filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="855" cy="55" r="170" fill="#579edd" opacity=".08"/><circle cx="65" cy="400" r="205" fill="#9bd8ff" opacity=".05"/>
  <text x="42" y="61" fill="#bcd9f4" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">ACTIVEREST / LOCAL WORKFLOW</text>
  <text x="42" y="105" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Know the time you actually observed.</text>
  <text x="42" y="134" fill="#a9c9e7" font-family="Arial,sans-serif" font-size="14">Windows · C# · Avalonia · no account</text>
  <g filter="url(#shadow)">
    <rect x="42" y="169" width="876" height="209" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".7"/>
    <rect x="62" y="188" width="237" height="170" rx="16" fill="#ffffff" fill-opacity=".75"/>
    <circle cx="88" cy="214" r="10" fill="#2f7fc6"/><text x="109" y="220" fill="#19395b" font-family="Arial,sans-serif" font-size="17" font-weight="700">Start / observe</text>
    <text x="78" y="256" fill="#4b6680" font-family="Arial,sans-serif" font-size="13">Choose Start tracking</text>
    <text x="78" y="282" fill="#4b6680" font-family="Arial,sans-serif" font-size="13">Process + idle time</text>
    <text x="78" y="308" fill="#4b6680" font-family="Arial,sans-serif" font-size="13">Output audio activity</text>
    <text x="316" y="276" fill="#588ab7" font-family="Arial,sans-serif" font-size="25">→</text>
    <rect x="357" y="188" width="246" height="170" rx="16" fill="#ffffff" fill-opacity=".75"/>
    <circle cx="384" cy="214" r="10" fill="#2f7fc6"/><text x="405" y="220" fill="#19395b" font-family="Arial,sans-serif" font-size="17" font-weight="700">Review today</text>
    <rect x="376" y="241" width="119" height="11" rx="5" fill="#2f7fc6"/><rect x="376" y="267" width="82" height="11" rx="5" fill="#74a5d0"/><rect x="376" y="293" width="45" height="11" rx="5" fill="#b7cde2"/>
    <text x="512" y="251" fill="#345776" font-family="Arial,sans-serif" font-size="12">Focused</text><text x="473" y="277" fill="#345776" font-family="Arial,sans-serif" font-size="12">Audio active</text><text x="436" y="303" fill="#345776" font-family="Arial,sans-serif" font-size="12">Rest</text>
    <text x="619" y="276" fill="#588ab7" font-family="Arial,sans-serif" font-size="25">→</text>
    <rect x="659" y="188" width="239" height="170" rx="16" fill="#ffffff" fill-opacity=".75"/>
    <circle cx="686" cy="214" r="10" fill="#2f7fc6"/><text x="707" y="220" fill="#19395b" font-family="Arial,sans-serif" font-size="17" font-weight="700">You control it</text>
    <rect x="678" y="240" width="94" height="30" rx="9" fill="#dcecf9"/><text x="697" y="260" fill="#235b8c" font-family="Arial,sans-serif" font-size="12" font-weight="700">Pause</text>
    <rect x="782" y="240" width="96" height="30" rx="9" fill="#dcecf9"/><text x="799" y="260" fill="#235b8c" font-family="Arial,sans-serif" font-size="12" font-weight="700">Export</text>
    <text x="678" y="302" fill="#4b6680" font-family="Arial,sans-serif" font-size="13">Delete history in settings</text>
  </g>
  <text x="42" y="406" fill="#a7c8e7" font-family="Arial,sans-serif" font-size="12">Workflow diagram · not a screenshot · observed time excludes long unobserved gaps</text>
</svg>
